<script>
  (function() {
    let duration = 30 * 60;
    let remaining = duration;
    let timerId = null;
    let isRunning = false;

    const display = document.getElementById('countdown-display');
    const ring = document.getElementById('timer-progress-ring');
    const toggleBtn = document.getElementById('toggle-focus-btn');
    const btnIcon = document.getElementById('btn-icon');
    const btnLabel = document.getElementById('btn-label');
    const abortBtn = document.getElementById('abort-btn');

    const totalCircumference = 2 * Math.PI * 116;

    function updateUI() {
      const mins = Math.floor(remaining / 60);
      const secs = remaining % 60;
      display.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      
      const progress = remaining / duration;
      const offset = totalCircumference * (1 - progress);
      ring.style.strokeDashoffset = offset;
    }

    function toggleTimer() {
      if (isRunning) {
        clearInterval(timerId);
        timerId = null;
        isRunning = false;
        btnLabel.textContent = 'RESUME FOCUS';
        btnIcon.textContent = 'play_arrow';
      } else {
        isRunning = true;
        btnLabel.textContent = 'PAUSE RESONANCE';
        btnIcon.textContent = 'pause';
        timerId = setInterval(() => {
          if (remaining > 0) {
            remaining--;
            updateUI();
          } else {
            clearInterval(timerId);
            isRunning = false;
            btnLabel.textContent = 'QUEST ACCOMPLISHED';
            btnIcon.textContent = 'check_circle';
          }
        }, 1000);
      }
    }

    function abortTimer() {
      clearInterval(timerId);
      timerId = null;
      isRunning = false;
      remaining = duration;
      updateUI();
      btnLabel.textContent = 'INITIATE FOCUS';
      btnIcon.textContent = 'play_arrow';
    }

    toggleBtn.addEventListener('click', toggleTimer);
    abortBtn.addEventListener('click', abortTimer);
    updateUI();
  })();
</script></main></body></html>
