on-secondary-container": "#006c71", "on-secondary-fixed": "#002021" }, borderRadius: { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, spacing: { "margin-desktop": "2.5rem", "space-md": "1rem", "space-xl": "2.25rem", "gutter-desktop": "1.5rem", "gutter": "1rem", "gutter-tablet": "1.25rem", "margin": "1rem", "margin-tablet": "1.5rem", "space-sm": "0.5rem", "space-xs": "0.25rem", "space-lg": "1.5rem" }, fontFamily: { "headline-md": ["Sora"], "headline-lg": ["Sora"], "headline-sm": ["Sora"], "display-lg": ["Sora"], "label-md": ["Space Grotesk"], "body-lg": ["Plus Jakarta Sans"], "label-sm": ["Space Grotesk"], "label-lg": ["Space Grotesk"], "body-sm": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "display-lg-mobile": ["Sora"], "title-md": ["Plus Jakarta Sans"] }, fontSize: { "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.03em", "fontWeight": "700" }], "label-md": ["11px", { "lineHeight": "16px", "letterSpacing": "0.08em", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "26px", "fontWeight": "400" }], "label-sm": ["10px", { "lineHeight": "14px", "letterSpacing": "0.1em", "fontWeight": "500" }], "label-lg": ["13px", { "lineHeight": "18px", "letterSpacing": "0.06em", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "18px", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "22px", "fontWeight": "400" }], "display-lg-mobile": ["34px", { "lineHeight": "42px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "title-md": ["16px", { "lineHeight": "24px", "fontWeight": "600" }] } } } };</script></head><body class="bg-surface font-body-md text-body-md text-on-surface min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container"><main class="flex flex-col flex-1 relative w-full bg-surface pb-safe pt-safe"><div class="flex flex-col w-full px-margin py-space-sm relative select-none">
<!-- Ambient Mana Surge Particles / Background Backlight -->
<div class="absolute -top-10 left-1/2 -translate-x-1/2 w-72 h-72 bg-primary-container/20 rounded-full blur-[80px] pointer-events-none"></div>
<div class="absolute bottom-10 left-1/2 -translate-x-1/2 w-64 h-64 bg-secondary-container/10 rounded-full blur-[90px] pointer-events-none"></div>
<!-- Header: Protocol Status Pill -->
<div class="flex items-center justify-between w-full z-10 mb-space-sm">
<div class="inline-flex items-center gap-space-xs bg-surface-container-lowest/80 px-space-sm py-1 rounded-full shadow-inner">
<span class="w-1.5 h-1.5 rounded-full bg-secondary-container animate-pulse shadow-[0_0_8px_#00f4fe]"></span>
<span class="font-label-sm text-label-sm text-secondary tracking-widest uppercase">HUNTER AUTHENTICATION PORTAL</span>
</div>
<div class="flex items-center gap-1 text-outline">
<span class="material-symbols-outlined text-[15px] text-primary">security</span>
<span class="font-label-sm text-label-sm tracking-wider uppercase text-on-surface-variant">SYS_V2.4</span>
</div>
</div>
<!-- Center Hero: Awakened Brand Logo -->
<div class="flex flex-col items-center justify-center my-space-xs relative z-10">
<div class="relative flex items-center justify-center py-1">
<div class="absolute inset-0 bg-primary-container/30 blur-2xl rounded-full scale-110"></div>
<img alt="Solo Leveling" class="h-20 w-auto object-contain relative drop-shadow-[0_0_25px_rgba(176,38,255,0.7)]" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBt-Ugw9qKLfyMF_yb9l94IOUsbDQo6Tur25xVa5B6hEYjde831VoInnKBQnc4J-KMjnI79iPaIJnl56xGscNn8vaQqvszSmP_KF9xUSw0LnSSjBi_LwfeaMPiPjjSpQP8oTe27xvvARYejzoArDLMPb84-NJI0_SerQNfE-5mD8YixH8t7Ks3pokp6mdNYjyhDYEBAvpx5AkfVfSPpsggeHolfd-2Uj5FDFbZTb1OhE67rnxTFsgy0pXi-UgSEOTnd5Q"/>
</div>
<div class="flex items-center gap-space-xs mt-1">
<span class="w-4 h-[1px] bg-gradient-to-r from-transparent to-primary"></span>
<p class="font-label-md text-label-md uppercase tracking-[0.22em] text-primary">
        LEVMAX • THE SYSTEM AWAKENING
      </p>
<span class="w-4 h-[1px] bg-gradient-to-l from-transparent to-primary"></span>
</div>
</div>
<!-- Main System Auth Card -->
<div class="w-full bg-surface-container-low/95 rounded-xl p-space-md shadow-2xl relative z-10 mt-space-xs">
<!-- Top Glowing Accent Line -->
<div class="absolute top-0 left-1/4 right-1/4 h-[1px] bg-gradient-to-r from-transparent via-primary to-transparent opacity-80"></div>
<form class="flex flex-col gap-space-sm" onsubmit="event.preventDefault(); triggerAwaken();">
<!-- Field 1: Hunter Identity -->
<div class="flex flex-col gap-1">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm tracking-wider uppercase text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[13px] text-primary">badge</span>
            HUNTER IDENTITY
          </label>
<span class="font-label-sm text-label-sm text-primary font-semibold">CLASS: UNKNOWN</span>
</div>
<div class="relative flex items-center bg-surface-container-lowest rounded-lg shadow-inner group transition-all duration-300">
<div class="absolute left-3 flex items-center pointer-events-none text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[18px]">person</span>
</div>
<input class="w-full bg-transparent pl-10 pr-3 py-2.5 font-body-md text-body-md text-on-surface placeholder:text-outline/40 focus:outline-none" placeholder="Sung Jin-Woo / Codename" required="" type="text"/>
</div>
</div>
<!-- Field 2: Security Cipher -->
<div class="flex flex-col gap-1">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm tracking-wider uppercase text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[13px] text-primary">key</span>
            SECURITY CIPHER
          </label>
<div class="flex items-center gap-1 bg-surface-container-high px-1.5 py-0.5 rounded">
<span class="w-1 h-1 rounded-full bg-secondary-container"></span>
<span class="font-label-sm text-[9px] uppercase tracking-wider text-secondary">SHA-256 READY</span>
</div>
</div>
<div class="relative flex items-center bg-surface-container-lowest rounded-lg shadow-inner group transition-all duration-300">
<div class="absolute left-3 flex items-center pointer-events-none text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[18px]">lock</span>
</div>
<input class="w-full bg-transparent pl-10 pr-10 py-2.5 font-body-md text-body-md text-on-surface placeholder:text-outline/40 focus:outline-none tracking-wider" id="cipher-input" placeholder="Enter Awakened Keyphrase" required="" type="password"/>
<button class="absolute right-3 flex items-center text-outline hover:text-primary focus:outline-none transition-colors" onclick="toggleCipherVisibility()" type="button">
<span class="material-symbols-outlined text-[18px]" id="cipher-eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember / Emergency Recovery -->
<div class="flex items-center justify-between pt-0.5">
<label class="flex items-center gap-2 cursor-pointer">
<input checked="" class="w-3.5 h-3.5 accent-primary-container rounded bg-surface-container-lowest cursor-pointer" type="checkbox"/>
<span class="font-label-sm text-label-sm text-on-surface-variant">Stay Synchronized</span>
</label>
<button class="font-label-sm text-label-sm text-tertiary hover:text-primary transition-colors uppercase tracking-wider" type="button">
          Lost Cipher?
        </button>
</div>
<!-- Primary Action: Awaken Button -->
<button class="relative mt-1 w-full py-3 px-space-md rounded-lg font-label-lg text-label-lg uppercase text-on-primary-container tracking-wider font-semibold bg-gradient-to-r from-[#7B2CBF] via-[#9D4EDD] to-primary-container hover:brightness-110 active:scale-[0.99] transition-all duration-200 shadow-[0_0_24px_rgba(176,38,255,0.45)] flex items-center justify-center gap-2 overflow-hidden" id="awaken-btn" type="submit">
<div class="absolute inset-0 bg-white/10 opacity-0 hover:opacity-100 transition-opacity pointer-events-none"></div>
<span class="material-symbols-outlined text-[18px] text-secondary-container" style="font-variation-settings: 'FILL' 1;">bolt</span>
<span>AWAKEN (LOGIN)</span>
</button>
</form>
<!-- Biometric Separator -->
<div class="relative flex items-center justify-center my-space-sm">
<div class="w-full h-[1px] bg-surface-container-highest"></div>
<span class="absolute px-2.5 py-0.5 bg-surface-container-low font-label-sm text-[10px] uppercase tracking-widest text-outline">
        OR FAST SYSTEM ACCESS
      </span>
</div>
<!-- Dual Biometric Pods -->
<div class="grid grid-cols-2 gap-space-sm">
<!-- Fingerprint Pod -->
<button class="flex flex-col items-center justify-center gap-1.5 py-2.5 px-space-xs rounded-lg bg-surface-container-lowest hover:bg-surface-container transition-all group active:scale-95 shadow-md" onclick="simulateBiometric('Fingerprint')" type="button">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center group-hover:shadow-[0_0_14px_rgba(176,38,255,0.4)] transition-all">
<span class="material-symbols-outlined text-[20px] text-primary group-hover:scale-110 transition-transform">fingerprint</span>
</div>
<div class="text-center">
<span class="font-label-sm text-label-sm text-on-surface uppercase tracking-wider block">Fingerprint</span>
<span class="font-label-sm text-[9px] text-outline block">Mana Resonance</span>
</div>
</button>
<!-- Face Scan Pod -->
<button class="flex flex-col items-center justify-center gap-1.5 py-2.5 px-space-xs rounded-lg bg-surface-container-lowest hover:bg-surface-container transition-all group active:scale-95 shadow-md" onclick="simulateBiometric('Face Scan')" type="button">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center group-hover:shadow-[0_0_14px_rgba(0,244,254,0.4)] transition-all">
<span class="material-symbols-outlined text-[20px] text-secondary-container group-hover:scale-110 transition-transform">document_scanner</span>
</div>
<div class="text-center">
<span class="font-label-sm text-label-sm text-on-surface uppercase tracking-wider block">Face Scan</span>
<span class="font-label-sm text-[9px] text-outline block">Neural Recognition</span>
</div>
</button>
</div>
</div>
<!-- Bottom Registration Link & Status Footer -->
<div class="flex flex-col items-center justify-center text-center mt-space-sm gap-1 z-10">
<button class="group flex items-center gap-1.5" type="button">
<span class="font-label-md text-label-md text-on-surface-variant group-hover:text-on-surface transition-colors">
        Unregistered Hunter?
      </span>
<span class="font-label-md text-label-md text-primary font-semibold group-hover:underline tracking-wide flex items-center">
        Awaken New Record
        <span class="material-symbols-outlined text-[13px] ml-0.5">arrow_forward</span>
</span>
</button>
<div class="flex items-center gap-2 mt-1">
<span class="w-1.5 h-1.5 rounded-full bg-primary-container"></span>
<span class="font-label-sm text-[10px] uppercase tracking-widest text-outline">
        SYSTEM SHADOW PROTOCOL • SECURE GATE
      </span>
</div>
</div>
<!-- Micro-interaction Notification Toast -->
<div class="fixed top-12 left-1/2 -translate-x-1/2 px-4 py-2 bg-surface-container-high rounded-full shadow-[0_0_20px_rgba(0,244,254,0.3)] flex items-center gap-2 transition-all duration-300 opacity-0 pointer-events-none -translate-y-4 z-50" id="status-toast">
<span class="material-symbols-outlined text-[16px] text-secondary-container" id="toast-icon">sync</span>
<span class="font-label-sm text-label-sm tracking-wide text-secondary uppercase" id="toast-msg">Connecting to Monarch Gate...</span>
</div>
</div>
<script>
  function toggleCipherVisibility() {
    const input = document.getElementById('cipher-input');
    const icon = document.getElementById('cipher-eye-icon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function showToast(message, iconName = 'sync', isSuccess = false) {
    const toast = document.getElementById('status-toast');
    const msgEl = document.getElementById('toast-msg');
    const iconEl = document.getElementById('toast-icon');
    
    msgEl.textContent = message;
    iconEl.textContent = iconName;
    if (isSuccess) {
      iconEl.className = "material-symbols-outlined text-[16px] text-primary";
      msgEl.className = "font-label-sm text-label-sm tracking-wide text-primary uppercase font-semibold";
    } else {
      iconEl.className = "material-symbols-outlined text-[16px] text-secondary-container";
      msgEl.className = "font-label-sm text-label-sm tracking-wide text-secondary uppercase";
    }

    toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-4');
    toast.classList.add('opacity-100', 'translate-y-0');

    setTimeout(() => {
      toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-4');
      toast.classList.remove('opacity-100', 'translate-y-0');
    }, 2400);
  }

  function simulateBiometric(type) {
    showToast(`${type.toUpperCase()} VERIFIED • SYSTEM UNLOCKED`, 'verified', true);
  }

  function triggerAwaken() {
    showToast('AWAKENING HUNTER PROTOCOL...', 'bolt', true);
  }
</script></main></body></html>
